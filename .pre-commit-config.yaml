---
default_install_hook_types: [pre-push]
default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-yaml
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: pretty-format-json
        args: [--autofix]
      - id: trailing-whitespace

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 8ef330cbb7204d388aa7a620f9549bcea8009663  # frozen: 0.37.3
    hooks:
      - id: check-github-workflows
      - id: check-dependabot

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
        args:
          # actionlint's bundled metadata predates create-github-app-token's client-id auth,
          # so it false-positives on client-id / "missing app-id". The action supports it.
          - -ignore=create-github-app-token
          # SC2129 is a pure style suggestion (group redirects); not worth enforcing here.
          - -ignore=SC2129

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: e3eebf65325ccc992422292cb7a4baee967cf815  # frozen: v1.26.1
    hooks:
      - id: zizmor

  - repo: https://github.com/syntaqx/git-hooks
    rev: a3b888f92cd5b40b270c9a9752181fdc1717cbe5  # frozen: v0.0.18
    hooks:
      - id: shellcheck
        args: [--shell=bash, --external-sources]
      - id: shfmt
        args: [--indent=2, --case-indent, --language-dialect=bash, --write]

  - repo: https://github.com/codespell-project/codespell
    rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a  # frozen: v2.4.2
    hooks:
      - id: codespell

  - repo: https://github.com/executablebooks/mdformat
    rev: 2d496dbc18e31b83a1596685347ffe0b6041daf0  # frozen: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-footnote
          - mdformat-gfm

  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: just-fmt
        name: just --fmt
        language: system
        entry: just --fmt
        files: '^justfile$'
        pass_filenames: false
