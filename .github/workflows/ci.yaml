name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # frozen: v7
        with:
          persist-credentials: false

      - name: ⚡ Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # frozen: v4

      - name: 🎨 Format
        run: just fmt-check

      - name: 🔍 Clippy
        run: just lint

      - name: 🧪 Test
        run: just test

  action:
    name: Action scripts
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # frozen: v7
        with:
          persist-credentials: false

      - name: 🐚 Shellcheck
        run: shellcheck scripts/*.sh tests/action/*.sh

      - name: 🧪 Argv mapping test
        run: bash tests/action/run_argv_test.sh

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # frozen: v7
        with:
          persist-credentials: false

      - name: 🐍 Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # frozen: v6
        with:
          python-version: "3.13"

      - name: ⚡ Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # frozen: v4

      - name: 🔍 Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # frozen: v3.0.1
