[package]
name = "lockstep"
version = "0.1.0"
edition = "2024"
authors = ["Robert Wlodarczyk <robert@simplicityguy.com>"]
description = "Keep every pinned dependency in a repo in step with upstream."
license = "MIT"
repository = "https://github.com/SimplicityGuy/lockstep"

[[bin]]
name = "lockstep"
path = "src/main.rs"

[lints.rust]
warnings = "deny"

[dependencies]
clap = { version = "4", features = ["derive", "env", "cargo"] }
clap_complete = "4"
indicatif = "0.17"
console = "0.15"
ureq = { version = "2", features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
regex = "1"
which = "7"
anyhow = "1"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
mockito = "1"
